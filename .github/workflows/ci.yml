name: Checks

# Every check there is — typecheck, lint, the unit tests and the end-to-end specs in Chromium — run by
# hand (Actions ▸ Checks ▸ Run workflow), not on a push: the specs take minutes, and they are run
# locally before a change goes in (`npm run e2e`).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e -- --trace off
