name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Allow one concurrent deployment; let in-progress runs finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # A change that breaks the file format must not reach anyone's notes.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # …nor one that breaks the canvas: the specs drive the built single file in Chromium.
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e -- --trace off
      # The displayed version bumps per deploy, not per local build: 0.1.<run number>.
      - run: npm run build
        env:
          APP_VERSION: 0.1.${{ github.run_number }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Only the job that publishes may write to Pages.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
