<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover: WITHOUT it iOS letterboxes the whole layout viewport into the safe area, so
     an iPhone in landscape loses a ~50px strip of canvas down each side (and a notch-width band at
     the top in standalone/PWA mode) to flat background colour. With it the page owns every pixel of
     the screen and the insets become OUR problem instead — styles.css's --sa-t/r/b/l (fed by env())
     add them back under every piece of fixed chrome, and utils/dom.ts's placeInViewport does the
     same for the panels that are placed by script. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Corkboard</title>

     opened from a file:// path; the PNG/manifest links (copied from public/) drive the
     home-screen / PWA-install icon when served over http(s). -->

<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f5f5f5">   <!-- follows the canvas colour (main.ts syncThemeColor) -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Corkboard">
</head>
<body>
  <!-- a failed save, shown until a write lands (data/save-alert.ts): #status is hidden, so this is
       the ONE place a lost write can surface; it stays until fixed, where a toast fades -->
  <div id="saveAlert" role="alert" hidden>
    <span id="saveAlertMsg"></span>
    <button id="saveAlertRetry">Retry now</button>
  </div>
  <!-- home / storage: floating bar in the top-left; the folder name sits beside the button -->
  <div id="homeBar">
    <button id="homeBtn" class="floating-btn" title="Home — recent folders / open another" aria-label="Home — recent folders">
      <span class="ic" data-icon="corkboard"></span></button>
    <!-- the map name is the FIRST segment of the path (features/breadcrumbs.ts) — a real button, so
         it's how you get back out to the whole map; inert while nothing is open. Its text is written
         by data/persistence.ts. -->
    <button type="button" id="folderName" class="sc-crumb sc-section"></button>
    <!-- …and the section levels below it: the ONE way back out of an open section. -->
    <nav id="scopeBar" aria-label="Open section"></nav>
  </div>

  <!-- No toolbar: every action is in the ⌘P palette (features/palette.ts), with its shortcut beside
       it. #status is the toast setStatus writes (core/state.ts): a pill at the bottom that fades. -->
  <div id="status" role="status" aria-live="polite"></div>
  <!-- the ONE mode that needs to be visible at a glance, since nothing can be edited in it -->
  <button id="roBadge" hidden title="Turn off read-only (R)">Read-only. Click to turn off</button>
  <div id="palette" hidden>
    <div class="pal-box" role="dialog" aria-label="Command palette">
      <input id="palInput" type="text" placeholder="Type a command…" autocomplete="off" spellcheck="false" aria-label="Command" />
      <div id="palList" role="listbox"></div>
    </div>
  </div>

  <!-- floating search bar, top centre: opened with ⌘F or /, a #tag, or a click on a tag — see features/search.ts -->
  <div id="searchWrap">
    <span class="ic" data-icon="search"></span>
    <input id="searchBox" type="text" placeholder="Find a card, or #tag…" title="Find (⌘F)" aria-label="Find a card by text or tag" autocomplete="off" spellcheck="false" />
    <span id="searchNav">
      <span id="searchCount"></span>
      <button id="searchPrev" title="Previous match" aria-label="Previous match"><span class="ic" data-icon="chevron"></span></button>
      <button id="searchNext" title="Next match" aria-label="Next match"><span class="ic" data-icon="chevron"></span></button>
    </span>
    <button id="searchClear" title="Clear search · close (Esc)" aria-label="Clear search or close">
      <span class="ic" data-icon="close"></span></button>
    <div id="searchResults"></div>
  </div>

  <div id="stage">
    <!-- background grid (none/dot/mesh/line, set in the map settings): a SCREEN-SPACE layer, sibling of
         (and painted below) #world — deliberately NOT inside #world. A pattern that inherits the
         zoom transform scales its own dots/strokes with it, so at any k≠1 the browser resamples
         a sub-pixel pattern across the whole canvas — that's the moiré. Here the dots/lines are
         always exactly 1 screen px and only the spacing follows the zoom. Two nested layers:
         #grid draws the major cell, #gridFine the sub-grid of 4 cells inside it, and the
         sub-grid's opacity fades out as you zoom out — by the time its cells get too dense the
         level has stepped up by a factor of 4 with the sub-grid already invisible, so it never
         pops. See view/grid.ts for the level-of-detail math. Panning only writes #grid's
         transform (compositor-only); the gradients are rebuilt only when the level changes. -->
    <div id="grid"><div id="gridFine"></div></div>
    <div id="world">
      <!-- free edges: the relations the user DREW (board.json). The lines are drawn ABOVE the cards (see the layer ladder in
           styles.css) — a line is followed, so it may not dive under a card in its path.
           Their invisible CLICK targets are a second layer, kept BEHIND the cards: an edge's hit
           stroke is 18px wide (HIT_W), and over a card that band would swallow the card's own
           press. So the stretch of a line that crosses a card is visible there but belongs to the
           card, exactly as it did when the whole layer sat behind them. -->
      <svg id="freeEdgeHits"></svg>
      <svg id="freeEdges" class="fe-lines"></svg>
      <!-- toggles overlay renders ABOVE node divs so collapse dots are always visible -->
      <svg id="toggles"></svg>
      <!-- drag GROUP layer: while dragging, the dragged cards are moved in here so the whole set
           composites as ONE translucent group (opacity on the layer, not per item) — you see the
           canvas below but the dragged items never shine through each other. -->
      <div id="dragLayer">
        <!-- the lines with an end in hand, drawn above the cards in hand (view/free-edges.ts) -->
        <svg id="freeEdgesHeld" class="fe-lines"></svg>
      </div>
    </div>
  </div>

  <!-- starts closed (no "open" class) so it doesn't flash in before syncFloatBar() runs.
       Floats next to the selected card (features/float-bar.ts). -->
  <div id="floatBar">
    <!-- FigJam's colour dropdown: the current colour's dot and a chevron, on a raised chip -->
    <button id="fbColor" class="fb-dd" title="Colour — click for the full palette" aria-label="Colour">
      <span id="fbColorDot" class="fb-swatch swatch inherit"></span><span class="ic fb-chev" data-icon="chevron"></span></button>
    <span class="fb-sep"></span>
    <!-- lock toggle: icon (open/closed padlock) + title set from the selection in float-bar.ts.
         While the selection IS locked the bar collapses to just this button (see .locked-sel). -->
    <!-- go IN: the touch-reachable twin of ↑ / ⋯ → Open, for a section. The float bar is the one action
         surface that is identical on desktop and on a phone (it docks to the bottom on coarse pointers). -->
    <!-- a SECTION's title: names an untitled section (seeding "Section") and selects the name to type over -->
    <button id="fbTitle" class="fb-icon" title="Title (F2)" aria-label="Title">
      <span class="ic" data-icon="text"></span></button>
    <!-- several selected: tidy up / align / distribute (features/tidy.ts) — a dropdown -->
    <button id="fbTidy" class="fb-icon fb-dd" title="Tidy up and align" aria-label="Tidy up and align">
      <span class="ic" data-icon="tidy"></span><span class="ic fb-chev" data-icon="chevron"></span></button>
    <!-- one section selected: lay out the cards inside it (features/tidy.ts tidySection) -->
    <button id="fbTidySection" class="fb-icon" title="Tidy up the section" aria-label="Tidy up the section">
      <span class="ic" data-icon="tidy"></span></button>
    <!-- collapse / expand the selection: a card to its one-line chip, a section to its label pill -->
    <button id="fbFold" class="fb-icon" title="Collapse (X)" aria-label="Collapse">
      <span class="ic ic-fold" data-icon="fold"></span><span class="ic ic-unfold" data-icon="unfold"></span></button>
    <button id="fbFit" class="fb-icon" title="Resize to fit (⌥⇧⌘R)" aria-label="Resize to fit">
      <span class="ic" data-icon="expand"></span></button>
    <button id="fbOpen" class="fb-icon" title="Open (⌘↓)" aria-label="Open">
      <span class="ic" data-icon="enter"></span></button>
    <button id="fbWrap" class="fb-icon" title="Wrap in new section (⌘S)" aria-label="Wrap in new section">
      <span class="ic" data-icon="wrap-section"></span></button>
    <button id="fbUngroup" class="fb-icon" title="Ungroup (⌘⌫)" aria-label="Ungroup">
      <span class="ic" data-icon="ungroup"></span></button>
    <!-- a STACK becomes an ordinary section, its cards laid out in the box (features/stacks.ts) -->
    <button id="fbToSection" class="fb-icon" title="Turn into section" aria-label="Turn into section">
      <span class="ic" data-icon="wrap-section"></span></button>
    <button id="fbLock" class="fb-icon" title="Lock (L)" aria-label="Lock"></button>
  </div>
  <!-- the selected EDGE's bar (features/edge-bar.ts). Its own bar rather than a mode of #floatBar:
       that one is anchored to a CARD and keyed on state.sel throughout, and an edge shares none of
       its controls. Starts closed so it doesn't flash in before the first sync. -->
  <div id="edgeBar">
    <!-- every button that opens a picker is a dropdown (.fb-dd): its face, then a chevron -->
    <button id="ebColor" class="fb-dd" title="Colour" aria-label="Edge colour">
      <span id="ebColorDot" class="fb-swatch swatch"></span><span class="ic fb-chev" data-icon="chevron"></span></button>
    <button id="ebDash" class="fb-icon fb-dd" title="Line style" aria-label="Line style"></button>
    <button id="ebArrows" class="fb-icon fb-dd" title="Line ends" aria-label="Line ends"></button>
  </div>
  <div id="ebColorPop" class="fb-pop"><div id="ebColors" class="swatches"></div></div>
  <div id="ebArrowPop" class="fb-pop"><div id="ebArrowChips" class="capcols"></div></div>
  <div id="ebDashPop" class="fb-pop"><div id="ebDashChips" class="layoutchips"></div></div>
  <!-- the label editor, opened by DOUBLE-CLICKING an edge; positioned over the line's midpoint -->
  <input id="ebLabelEdit" type="text" spellcheck="false" placeholder="Label…" aria-label="Edge label">

  <div id="fbColorPop" class="fb-pop">
    <div id="edColors" class="swatches"></div>
  </div>
  <!-- thin stem bridging an open popover to the bar — see .fb-pop-connector in styles.css -->

  <!-- canvas menu: floating top-right, left of the outline button — a permanent kebab so canvas
       actions (new card, insert image, paste, fit view) are reachable without a right-click / long-press
       (iOS Safari's synthesized contextmenu on the empty canvas is unreliable). Shares the same entry
       list as the right-click menu (features/context-menu.ts canvasMenuEntries). -->
  <button id="canvasMenuBtn" class="floating-btn" title="Canvas menu — new card, insert image…" aria-label="Canvas menu">
    <span class="ic" data-icon="kebab"></span></button>



  <!-- map settings, opened from the dock's #settingsBtn (features/canvas-color.ts). The colour edits the
       canvas you're standing on: the MAP at the top level, the OPEN SECTION inside one. The grid rows
       are view/grid.ts's. -->
  <div id="settingsPop" class="fb-pop" role="dialog" aria-label="Map settings">
    <span id="setColorHead" class="set-head set-color">Canvas colour</span>
    <!-- a colour FIELD: the live colour's chip, opening the swatch picker below (nested so a click in it
         counts as inside the panel) -->
    <button id="canvasColorBtn" class="fb-dd set-color" data-pop="canvasColorPop" aria-label="Canvas colour" aria-expanded="false">
      <span class="fb-swatch swatch inherit"></span><span class="ic fb-chev" data-icon="chevron"></span></button>
    <div id="canvasColorPop" class="fb-pop"><div id="canvasColors" class="swatches"></div></div>
    <span class="set-head">Grid</span>
    <button id="gridBtn" class="fb-dd" data-pop="gridPop" aria-label="Grid" aria-expanded="false"></button>
    <div id="gridPop" class="fb-pop"><div id="gridStyles" class="set-list"></div></div>
    <span class="set-head">Snap</span>
    <button id="snapBtn" class="fb-dd" data-pop="snapPop" aria-label="Snap" aria-expanded="false"></button>
    <div id="snapPop" class="fb-pop"><div id="gridSizes" class="set-list"></div></div>
  </div>

  <!-- the DOCK, bottom centre — FigJam's main toolbar: the sticky you drag a new card off, the tag
       tray, then the map's settings and every command. -->
  <div id="dock">
    <!-- ghost card — drag it onto the canvas to create a new card -->
    <div id="ghostCard" title="Drag to create a new card">+</div>
    <!-- the tag tray's toggle (features/tag-tray.ts): a sheet of tag stickers to drag onto cards -->
    <button id="trayBtn" class="floating-btn" title="Tag tray (T)" aria-label="Tag tray" aria-pressed="false">
      <span class="ic" data-icon="tag"></span></button>
    <span class="dock-sep"></span>
    <!-- the map's own settings (canvas colour, grid): one panel, #settingsPop -->
    <button id="settingsBtn" class="floating-btn" title="Map settings" aria-label="Map settings" aria-expanded="false">
      <span class="ic" data-icon="settings"></span></button>
    <!-- Actions: the command palette's own button (FigJam's quick actions), the way in for touch and the
         hint that ⌘P exists. The palette opens just above it. -->
    <button id="paletteBtn" class="floating-btn" title="Actions (⌘P)" aria-label="Actions">
      <span class="ic" data-icon="actions"></span></button>
  </div>

  <!-- home sidebar: slides in from the left (home button). Tabs pick the storage backend,
       "+" creates/opens a map there, the list below shows that backend's maps. Clicking
       the space right of the sidebar closes it. -->
  <div id="startScreen" class="hidden">
    <aside id="storeSidebar" aria-label="Your maps">
      <div class="side-head">
        <h2 class="side-title">Your maps</h2>
        <button id="startClose" class="start-close" aria-label="Close" title="Close"><span class="ic" data-icon="close"></span></button>
      </div>
      <div class="store-tabs" role="tablist">
        <button id="tabDevice" class="store-tab" role="tab" title="Maps kept in this browser"><span class="ic" data-icon="device"></span>Device</button>
        <button id="tabFolder" class="store-tab" role="tab" title="A folder of Markdown notes on your computer"><span class="ic" data-icon="folder"></span>Folder</button>
        <button id="tabNote" class="store-tab" role="tab" title="One Markdown note, opened as a single card"><span class="ic" data-icon="document"></span>Note</button>
      </div>
      <button id="newBtn" class="side-row"><span class="ic" data-icon="plus"></span><span id="newBtnLabel">New map</span></button>
      <div id="mapList"></div>
      <div class="side-footer">
        <button id="importBtn" class="side-row" title="Import a .zip as a new map"><span class="ic" data-icon="import"></span> Import .zip</button>
        <div class="side-about">
          <a href="https://github.com/ahackel/corkboard" target="_blank" rel="noopener" title="Source code on GitHub"><span class="ic" data-icon="github"></span>GitHub</a>
          <span id="appVersion"></span>
        </div>
      </div>
    </aside>
  </div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
