[package]
name = "corkboard"
version = "1.0.0"
description = "Corkboard: a sticky-note wall over a folder of Markdown notes"
authors = ["Andreas Hackel"]
license = "MIT"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
